name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build firmware with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.2
          target: esp32c3
          path: '.'

      - name: Gather flashable images
        run: |
          mkdir -p out
          cp build/azhu_passport.bin                    out/
          cp build/bootloader/bootloader.bin            out/
          cp build/partition_table/partition-table.bin  out/
          cp build/flasher_args.json                    out/ || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: azhu-passport-c3
          path: out/

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fw-${{ github.run_number }}
          name: azhu firmware build ${{ github.run_number }}
          files: |
            out/bootloader.bin
            out/partition-table.bin
            out/azhu_passport.bin
